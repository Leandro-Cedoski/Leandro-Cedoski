<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @keyframes fade {
        0%, 10% { opacity: 1; visibility: visible; }
        12%, 100% { opacity: 0; visibility: hidden; }
      }
      
      .slide {
        position: absolute;
        width: 800px;
        height: 500px;
        opacity: 0;
        visibility: hidden;
        animation: fade 50s infinite ease-in-out;
      }
      
      .s1 { animation-delay: 0s; }
      .s2 { animation-delay: 5s; }
      .s3 { animation-delay: 10s; }
      .s4 { animation-delay: 15s; }
      .s5 { animation-delay: 20s; }
      .s6 { animation-delay: 25s; }
      .s7 { animation-delay: 30s; }
      .s8 { animation-delay: 35s; }
      .s9 { animation-delay: 40s; }
      .s10 { animation-delay: 45s; }

      .legenda {
        font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 16px;
        fill: #ffffff;
      }
      .titulo { font-weight: bold; fill: #33CCFF; }
      .autor { font-style: italic; fill: #aaaaaa; }
      .numero { font-weight: bold; fill: #ffffff; }
    </style>
  </defs>

  <rect width="800" height="500" fill="#0d1117" rx="8"/>

  <g class="slide s1">
    <image href="https://raw.githubusercontent.com/Leandro-Cedoski/Leandro-Cedoski/main/assets/images/Leonardo_da_Vinci_(1452-1519)_-_The_Last_Supper_(1495-1498).jpg" crossorigin="anonymous" width="800" height="420" preserveAspectRatio="xMidYMid meet" />
    <rect y="420" width="800" height="80" fill="#161b22" />
    <text x="20" y="465" class="legenda"><tspan class="numero">01/10 | </tspan><tspan class="titulo">The Last Supper</tspan> <tspan class="autor">— Leonardo da Vinci</tspan></text>
  </g>

  <g class="slide s2">
    <image href="https://raw.githubusercontent.com/Leandro-Cedoski/Leandro-Cedoski/main/assets/images/God2-Sistine_Chapel.png" crossorigin="anonymous" width="800" height="420" preserveAspectRatio="xMidYMid meet" />
    <rect y="420" width="800" height="80" fill="#161b22" />
    <text x="20" y="465" class="legenda"><tspan class="numero">02/10 | </tspan><tspan class="titulo">The Creation of Adam</tspan> <tspan class="autor">— Michelangelo</tspan></text>
  </g>

  <g class="slide s3">
    <image href="https://raw.githubusercontent.com/Leandro-Cedoski/Leandro-Cedoski/main/assets/images/Mona_Lisa,_by_Leonardo_da_Vinci,_from_C2RMF_retouched.jpg" crossorigin="anonymous" width="800" height="420" preserveAspectRatio="xMidYMid meet" />
    <rect y="420" width="800" height="80" fill="#161b22" />
    <text x="20" y="465" class="legenda"><tspan class="numero">03/10 | </tspan><tspan class="titulo">Mona Lisa</tspan> <tspan class="autor">— Leonardo da Vinci</tspan></text>
  </g>

  <g class="slide s4">
    <image href="https://raw.githubusercontent.com/Leandro-Cedoski/Leandro-Cedoski/main/assets/images/Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg" crossorigin="anonymous" width="800" height="420" preserveAspectRatio="xMidYMid meet" />
    <rect y="420" width="800" height="80" fill="#161b22" />
    <text x="20" y="465" class="legenda"><tspan class="numero">04/10 | </tspan><tspan class="titulo">The Birth of Venus</tspan> <tspan class="autor">— Sandro Botticelli</tspan></text>
  </g>

  <g class="slide s5">
    <image href="https://raw.githubusercontent.com/Leandro-Cedoski/Leandro-Cedoski/main/assets/images/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg" crossorigin="anonymous" width="800" height="420" preserveAspectRatio="xMidYMid meet" />
    <rect y="420" width="800" height="80" fill="#161b22" />
    <text x="20" y="465" class="legenda"><tspan class="numero">05/10 | </tspan><tspan class="titulo">The Starry Night</tspan> <tspan class="autor">— Vincent van Gogh</tspan></text>
  </g>

  <g class="slide s6">
    <image href="https://raw.githubusercontent.com/Leandro-Cedoski/Leandro-Cedoski/main/assets/images/Michelangelo's_David_2015.jpg" crossorigin="anonymous" width="800" height="420" preserveAspectRatio="xMidYMid meet" />
    <rect y="420" width="800" height="80" fill="#161b22" />
    <text x="20" y="465" class="legenda"><tspan class="numero">06/10 | </tspan><tspan class="titulo">David</tspan> <tspan class="autor">— Michelangelo</tspan></text>
  </g>

  <g class="slide s7">
    <image href="https://raw.githubusercontent.com/Leandro-Cedoski/Leandro-Cedoski/main/assets/images/Front_views_of_the_Venus_de_Milo.jpg" crossorigin="anonymous" width="800" height="420" preserveAspectRatio="xMidYMid meet" />
    <rect y="420" width="800" height="80" fill="#161b22" />
    <text x="20" y="465" class="legenda"><tspan class="numero">07/10 | </tspan><tspan class="titulo">Venus de Milo</tspan> <tspan class="autor">— Alexandros of Antioch</tspan></text>
  </g>

  <g class="slide s8">
    <image href="https://raw.githubusercontent.com/Leandro-Cedoski/Leandro-Cedoski/main/assets/images/The_Pietà_by_Michelangelo_(48135182552).jpg" crossorigin="anonymous" width="800" height="420" preserveAspectRatio="xMidYMid meet" />
    <rect y="420" width="800" height="80" fill="#161b22" />
    <text x="20" y="465" class="legenda"><tspan class="numero">08/10 | </tspan><tspan class="titulo">Pietà</tspan> <tspan class="autor">— Michelangelo</tspan></text>
  </g>

  <g class="slide s9">
    <image href="https://raw.githubusercontent.com/Leandro-Cedoski/Leandro-Cedoski/main/assets/images/Laocoon_Pio-Clementino_Inv1059-1064-1067.jpg" crossorigin="anonymous" width="800" height="420" preserveAspectRatio="xMidYMid meet" />
    <rect y="420" width="800" height="80" fill="#161b22" />
    <text x="20" y="465" class="legenda"><tspan class="numero">09/10 | </tspan><tspan class="titulo">Laocoön and His Sons</tspan> <tspan class="autor">— Agesander, Athenodorus and Polydorus</tspan></text>
  </g>

  <g class="slide s10">
    <image href="https://raw.githubusercontent.com/Leandro-Cedoski/Leandro-Cedoski/main/assets/images/Victoire_de_Samothrace_-_Musee_du_Louvre_-_20190812.jpg" crossorigin="anonymous" width="800" height="420" preserveAspectRatio="xMidYMid meet" />
    <rect y="420" width="800" height="80" fill="#161b22" />
    <text x="20" y="465" class="legenda"><tspan class="numero">10/10 | </tspan><tspan class="titulo">Winged Victory of Samothrace</tspan> <tspan class="autor">— Unknown</tspan></text>
  </g>

</svg>
